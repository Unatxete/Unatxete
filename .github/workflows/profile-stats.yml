name: Profile stats

# Regenerates assets/stats.svg with PUBLIC-only GitHub figures.
# Requires a repository secret PROFILE_STATS_TOKEN: a read-only, public-scope token
# (see the setup steps in the pull request / README notes). No private data is read.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 assets/stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/stats.svg; then
            echo "No change in stats.svg"
            exit 0
          fi
          git add assets/stats.svg
          git commit -m "Update profile stats"
          git push
