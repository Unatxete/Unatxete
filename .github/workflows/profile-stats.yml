name: Profile stats

# Regenerates assets/dark_mode.svg and assets/light_mode.svg with PUBLIC-only GitHub figures.
# Uses the existing METRICS_TOKEN secret (a classic token with public_repo scope).
# The script reads PUBLIC data only; no private-repository data is requested.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate card SVGs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 assets/stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/dark_mode.svg assets/light_mode.svg; then
            echo "No change in card SVGs"
            exit 0
          fi
          git add assets/dark_mode.svg assets/light_mode.svg
          git commit -m "Update profile stats"
          git push
