  <circle cx="26" cy="22.5" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22.5" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22.5" r="6" fill="#27c93f"/>
  <text x="240" y="27" text-anchor="middle" font-size="13" fill="#8b949e">unax@github: ~</text>

