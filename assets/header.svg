<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" role="img" aria-labelledby="btitle bdesc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="btitle">Unax Alonso</title>
  <desc id="bdesc">Unax Alonso — Cybersecurity · Automation · Applied AI</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="820" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- self-painted background: reads the same in light and dark themes -->
    <rect x="0" y="0" width="820" height="240" fill="url(#bg)"/>
    <rect x="0" y="0" width="820" height="240" fill="url(#fade)"/>

    <!-- subtle wave motif at the base -->
    <path d="M0 196 C 150 168, 300 224, 460 200 C 620 176, 720 214, 820 192 L820 240 L0 240 Z" fill="#000000" fill-opacity="0.16"/>
    <path d="M0 214 C 170 190, 320 236, 500 214 C 660 194, 740 224, 820 210 L820 240 L0 240 Z" fill="#000000" fill-opacity="0.22"/>

    <!-- faint monospace prompt watermark -->
    <text x="40" y="58" font-size="15" fill="#c4b5fd" fill-opacity="0.72">unax@github:~$</text>

    <!-- name -->
    <text x="40" y="140" font-size="66" font-weight="700" fill="#f5f3ff" letter-spacing="0.5">Unax Alonso</text>

    <!-- tagline -->
    <text x="43" y="180" font-size="21" fill="#ddd6fe">Cybersecurity<tspan fill="#a78bfa"> · </tspan>Automation<tspan fill="#a78bfa"> · </tspan>Applied AI</text>
  </g>

  <rect x="0.75" y="0.75" width="818.5" height="238.5" rx="16" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
